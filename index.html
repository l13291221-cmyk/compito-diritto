<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Video-presentazione su Umberto Terracini, l'Assemblea Costituente e la nascita della Repubblica Italiana.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <title>Umberto Terracini e la Repubblica</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0a0e1c;
      --stage:#0f1530;
      --stage-2:#131a38;
      --border:rgba(233,236,247,.10);
      --border-strong:rgba(233,236,247,.20);
      --text:#eef0f8;
      --text-soft:#dde1f0;
      --muted:#9aa3c0;
      --muted-2:#6c7498;
      --gold:#d6ab52;
      --gold-2:#e6c574;
      --gold-soft:rgba(214,171,82,.14);
      --green:#1a9d55;
      --tri-white:#edefe8;
      --red:#cf2b3b;
      --radius:20px;
      --serif:"Spectral","Iowan Old Style",Georgia,serif;
      --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
    }

    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 820px at 14% -12%, rgba(214,171,82,.11), transparent 56%),
        radial-gradient(1000px 760px at 104% 116%, rgba(26,52,120,.5), transparent 60%),
        var(--bg);
      background-attachment:fixed;
      min-height:100dvh;
      display:flex;flex-direction:column;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      line-height:1.55;
    }

    .rail{
      position:fixed;inset:0 0 auto 0;height:4px;z-index:40;
      background:linear-gradient(90deg,
        var(--green) 0 33.33%, var(--tri-white) 33.33% 66.66%, var(--red) 66.66% 100%);
    }

    .app{
      width:100%;max-width:1000px;
      margin:0 auto;
      flex:1 1 auto;
      display:flex;flex-direction:column;justify-content:center;
      gap:18px;
      padding:clamp(26px,5vw,52px) clamp(16px,4vw,34px);
    }

    /* ===== Palco ===== */
    .stage{
      position:relative;
      background:linear-gradient(165deg,var(--stage),var(--stage-2));
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
      overflow:hidden;
      display:flex;flex-direction:column;
      min-height:clamp(440px,64vh,600px);
    }

    .progress-track{height:4px;width:100%;background:rgba(255,255,255,.06);flex:0 0 auto;}
    .progress-fill{
      height:100%;width:0%;
      background:linear-gradient(90deg,var(--gold),var(--gold-2));
      box-shadow:0 0 16px rgba(214,171,82,.5);
      transition:width .09s linear;
    }

    .stage-head{
      display:flex;align-items:center;gap:14px;
      padding:clamp(15px,2.6vw,20px) clamp(26px,5vw,58px);
      border-bottom:1px solid var(--border);
      background:rgba(255,255,255,.02);
      flex:0 0 auto;
    }
    .seal{
      display:inline-flex;align-items:center;justify-content:center;
      width:38px;height:38px;flex:0 0 auto;border-radius:50%;
      background:var(--gold-soft);border:1px solid rgba(214,171,82,.45);
      color:var(--gold-2);font-size:1.2rem;
    }
    .doc-title{
      font-family:var(--serif);font-weight:700;
      font-size:clamp(1.02rem,2.5vw,1.5rem);line-height:1.14;margin:0;
      letter-spacing:.01em;text-wrap:balance;
    }
    .doc-sub{
      font-size:clamp(.76rem,1.7vw,.95rem);color:var(--muted);margin:3px 0 0;
    }

    /* ===== Slide ===== */
    .slides{position:relative;flex:1 1 auto;display:grid;}
    .slide{
      grid-area:1 / 1;
      padding:clamp(24px,4.2vw,50px) clamp(26px,5vw,58px);
      display:flex;flex-direction:column;justify-content:center;
      opacity:0;visibility:hidden;
      transform:translateY(12px);
      transition:opacity .6s ease, transform .6s ease, visibility 0s linear .6s;
    }
    .slide.is-active{
      opacity:1;visibility:visible;transform:none;
      transition:opacity .6s ease, transform .6s ease, visibility 0s;
    }

    .kicker{
      font-family:var(--mono);font-weight:600;
      font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;
      color:var(--gold-2);
      display:flex;align-items:center;gap:12px;
      margin-bottom:clamp(14px,2.4vw,20px);
    }
    .kicker .num{
      color:var(--muted);
      border:1px solid var(--border-strong);border-radius:6px;
      padding:2px 8px;letter-spacing:.08em;
    }

    .slide-title{
      font-family:var(--serif);font-weight:700;
      font-size:clamp(1.75rem,4.6vw,3rem);line-height:1.1;margin:0;
      letter-spacing:-.005em;text-wrap:balance;
    }

    .points{
      list-style:none;padding:0;margin:clamp(18px,3vw,28px) 0 0;
      display:flex;flex-direction:column;gap:clamp(12px,1.8vw,17px);
      max-width:64ch;
    }
    .points li{
      position:relative;padding-left:32px;
      font-size:clamp(1rem,2.05vw,1.24rem);color:var(--text-soft);
      opacity:0;transform:translateY(8px);
      transition:opacity .5s ease, transform .5s ease;
    }
    .points li::before{
      content:"";position:absolute;left:0;top:.62em;
      width:10px;height:10px;border-radius:50%;
      background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);
    }
    .slide.is-active .points li{opacity:1;transform:none;}
    .slide.is-active .points li:nth-child(1){transition-delay:.16s;}
    .slide.is-active .points li:nth-child(2){transition-delay:.30s;}
    .slide.is-active .points li:nth-child(3){transition-delay:.44s;}
    .slide.is-active .points li:nth-child(4){transition-delay:.58s;}

    .slide-title em{
      color:var(--gold-2);font-style:italic;
    }

    /* ===== Controlli minimi ===== */
    .controls{
      display:flex;align-items:center;gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .ctl{
      appearance:none;cursor:pointer;font-family:var(--sans);
      color:var(--text);background:rgba(255,255,255,.05);
      border:1px solid var(--border);border-radius:11px;
      width:44px;height:44px;font-size:1.1rem;line-height:1;
      display:inline-flex;align-items:center;justify-content:center;
      transition:background .18s ease, border-color .18s ease, transform .12s ease;
    }
    .ctl:hover{background:rgba(255,255,255,.1);border-color:var(--border-strong);}
    .ctl:active{transform:translateY(1px);}
    .ctl:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
    .ctl--play{
      background:var(--gold-soft);border-color:rgba(214,171,82,.5);color:var(--gold-2);
      width:52px;height:52px;font-size:1.15rem;
    }
    .ctl--play:hover{background:rgba(214,171,82,.22);}

    .dots{display:flex;align-items:center;gap:9px;margin:0 4px;}
    .dot{
      width:10px;height:10px;border-radius:50%;padding:0;border:0;cursor:pointer;
      background:rgba(255,255,255,.2);transition:background .2s ease, width .2s ease;
    }
    .dot:hover{background:rgba(255,255,255,.42);}
    .dot.is-active{background:var(--gold);width:26px;border-radius:5px;}
    .dot:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

    .count{
      font-family:var(--mono);font-size:.82rem;color:var(--muted);
      font-variant-numeric:tabular-nums;letter-spacing:.05em;
      display:inline-flex;gap:5px;align-items:center;margin-left:2px;
    }
    .count b{color:var(--text);font-weight:600;}
    .count-sep{color:var(--muted-2);}

    @media (max-width:560px){
      .stage{min-height:clamp(460px,70vh,640px);}
      .ctl{width:42px;height:42px;}
    }
    @media (prefers-reduced-motion:reduce){
      .slide,.points li{transition-duration:.001s !important;}
      .progress-fill{transition:none;}
    }
  </style>
</head>
<body>
  <div class="rail" aria-hidden="true"></div>

  <div class="app">
    <main class="stage" aria-label="Presentazione: Umberto Terracini e la nascita della Repubblica">
      <div class="progress-track" role="presentation"><div class="progress-fill" id="progress"></div></div>

      <header class="stage-head">
        <span class="seal" aria-hidden="true">⚖</span>
        <div>
          <h1 class="doc-title">Umberto Terracini e la Nascita della Repubblica</h1>
          <p class="doc-sub">L'Assemblea Costituente e i valori della nostra Costituzione</p>
        </div>
      </header>

      <div class="slides" id="slides" aria-live="polite"></div>
    </main>

    <div class="controls" role="group" aria-label="Controlli presentazione">
      <button class="ctl" id="prevBtn" aria-label="Slide precedente">‹</button>
      <button class="ctl ctl--play" id="playBtn" aria-label="Metti in pausa"><span id="playIco">⏸</span></button>
      <button class="ctl" id="nextBtn" aria-label="Slide successiva">›</button>
      <div class="dots" id="dots" role="tablist" aria-label="Vai alla slide"></div>
      <div class="count"><b id="curNum">01</b><span class="count-sep">/</span><span id="totNum">04</span></div>
    </div>
  </div>

  <script>
  (function(){
    "use strict";

    const SLIDES = [
      {
        n:"01", kicker:"L'Assemblea Costituente", dur:16000,
        title:"Cos'è l'Assemblea Costituente?",
        points:[
          "Eletta il 2 giugno 1946: per la prima volta votano anche le donne.",
          "Composta da 556 deputati scelti dal popolo.",
          "Compito: scrivere la nuova Costituzione e portare l'Italia dal fascismo alla democrazia."
        ]
      },
      {
        n:"02", kicker:"Biografia", dur:20000,
        title:"Chi era Umberto Terracini?",
        points:[
          "Nato a Genova nel 1895 da famiglia ebrea, laureato in Giurisprudenza a Torino.",
          "Tra i fondatori del Partito Comunista Italiano con Antonio Gramsci.",
          "Oltre 11 anni di carcere e 5 di confino durante il fascismo: coerente con i suoi valori di libertà e democrazia.",
          "Dal 1947 Presidente dell'Assemblea Costituente: dalla prigione alla guida dei lavori."
        ]
      },
      {
        n:"03", kicker:"Il contributo", dur:15000,
        title:"L'Articolo 3 e la Firma",
        points:[
          "Volle inserire l'espressione «senza distinzione di sesso» nell'Articolo 3: parità tra uomini e donne.",
          "Il 27 dicembre 1947 firmò la Costituzione con Enrico De Nicola e Alcide De Gasperi."
        ]
      },
      {
        n:"04", kicker:"Conclusione", dur:16000,
        title:"«L'Italia è una Repubblica»",
        points:[
          "Il potere appartiene al popolo, non a un re o a un dittatore.",
          "Uno Stato fondato su libertà, rispetto delle regole e diritti di tutti i cittadini.",
          "Conquiste ottenute grazie al sacrificio di uomini come Umberto Terracini."
        ]
      }
    ];

    const $ = (id)=>document.getElementById(id);
    const slidesEl=$("slides"), dotsEl=$("dots"), progress=$("progress");
    const playBtn=$("playBtn"), playIco=$("playIco"), prevBtn=$("prevBtn"), nextBtn=$("nextBtn");
    const curNum=$("curNum"), totNum=$("totNum");
    const esc=(s)=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

    const slideNodes=[], dotNodes=[];
    SLIDES.forEach((s,i)=>{
      const el=document.createElement("article");
      el.className="slide";
      el.setAttribute("role","group");
      el.setAttribute("aria-roledescription","slide");
      el.setAttribute("aria-label",(i+1)+" di "+SLIDES.length+": "+s.title);
      let html='<div class="kicker"><span class="num">'+s.n+'</span>'+esc(s.kicker)+'</div>';
      html+='<h2 class="slide-title">'+esc(s.title)+'</h2>';
      html+='<ul class="points">'+s.points.map(p=>'<li>'+esc(p)+'</li>').join("")+'</ul>';
      el.innerHTML=html;
      slidesEl.appendChild(el);
      slideNodes.push(el);

      const dot=document.createElement("button");
      dot.className="dot";dot.setAttribute("role","tab");
      dot.setAttribute("aria-label","Slide "+(i+1));
      dot.addEventListener("click",()=>goTo(i,true));
      dotsEl.appendChild(dot);
      dotNodes.push(dot);
    });
    totNum.textContent=String(SLIDES.length).padStart(2,"0");

    let current=0, isPlaying=true, elapsed=0, lastTs=null;

    function render(){
      slideNodes.forEach((el,i)=>el.classList.toggle("is-active",i===current));
      dotNodes.forEach((d,i)=>{
        d.classList.toggle("is-active",i===current);
        d.setAttribute("aria-selected",i===current?"true":"false");
      });
      curNum.textContent=String(current+1).padStart(2,"0");
    }
    function setProgress(p){progress.style.width=(p*100).toFixed(2)+"%";}
    function resetTimer(){elapsed=0;lastTs=null;setProgress(0);}
    function goTo(i,user){
      current=(i+SLIDES.length)%SLIDES.length;
      resetTimer();render();
      if(user && !isPlaying) setProgress(0);
    }
    function setPlaying(v){
      isPlaying=v;
      playIco.textContent=v?"⏸":"▶";
      playBtn.setAttribute("aria-label",v?"Metti in pausa":"Riprendi");
    }

    function tick(ts){
      if(lastTs===null) lastTs=ts;
      let dt=ts-lastTs; lastTs=ts;
      if(dt>120) dt=120;
      if(isPlaying){
        elapsed+=dt;
        const dur=SLIDES[current].dur;
        setProgress(Math.min(elapsed/dur,1));
        if(elapsed>=dur) goTo(current+1);
      }
      requestAnimationFrame(tick);
    }

    playBtn.addEventListener("click",()=>setPlaying(!isPlaying));
    nextBtn.addEventListener("click",()=>goTo(current+1));
    prevBtn.addEventListener("click",()=>goTo(current-1));
    document.addEventListener("keydown",(e)=>{
      if(e.code==="Space"){e.preventDefault();setPlaying(!isPlaying);}
      else if(e.code==="ArrowRight"){e.preventDefault();goTo(current+1);}
      else if(e.code==="ArrowLeft"){e.preventDefault();goTo(current-1);}
    });
    document.addEventListener("visibilitychange",()=>{if(document.hidden)lastTs=null;});

    render();setProgress(0);
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
